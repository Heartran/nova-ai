# =============================================================================
# Claude Code — review automatico delle PR
# -----------------------------------------------------------------------------
# Gira AUTOMATICAMENTE su ogni PR aperta/aggiornata, senza bisogno di
# mention. Pubblica commenti di review focalizzati su Turni-di-Palco:
#   - sicurezza Supabase (RLS, service_role, secrets)
#   - accessibilità WCAG 2.1 AA / EN 301 549 / EAA
#   - correttezza, coerenza, performance
#
# Auth: OAuth token Claude.ai (Pro/Max).
#   Secret richiesto: CLAUDE_CODE_OAUTH_TOKEN
#
# NOTA: ogni run consuma quota dal tuo abbonamento Pro/Max. Se inizia a
# bruciare troppo, puoi:
#   - alzare il filtro paths sotto (review solo su file critici)
#   - abbassare --max-turns
#   - disabilitare temporaneamente il workflow da GitHub UI
# =============================================================================

name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "*.py"
      - "requirements.txt"
      - ".github/workflows/*.yml"
      - "AGENTS.md"

# Se arriva un nuovo push sulla stessa PR, cancella il review in corso
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip PR draft e PR aperte da bot (dependabot ecc.)
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read         # solo lettura del codice
      pull-requests: write   # pubblicare review comment
      issues: write          # commenti sulla PR (sono "issue comment" lato API)
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # serve la history completa per il diff

      - name: Claude Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--max-turns 20"
          prompt: |
            Sei il reviewer di **nova-ai**, bot Discord + WhatsApp scritto in
            Python che usa claude-agent-sdk, discord.py e un bridge Go per
            WhatsApp (SQLite polling + HTTP API).

            Fai una review del diff di questa PR e pubblica i tuoi findings come
            commenti inline sulle righe specifiche, quando possibile. Sii
            diretto, niente fluff. Se la PR è piccola e pulita, tre righe bastano.

            Consulta `AGENTS.md` solo se necessario per capire le convenzioni.

            ## Focus (in ordine di priorità)

            **1. Sicurezza**
            - Nessun token/secret hard-coded (Discord token, API key Anthropic).
            - Accesso SQLite: deve essere read-only (`?mode=ro`), mai write sul DB del bridge.
            - Input da WhatsApp/Discord mai eseguito come codice.

            **2. Correttezza e robustezza**
            - Gestione errori asyncio: task che crashano silenziosamente.
            - Checkpoint: aggiornato prima della chiamata Claude (non dopo).
            - Race condition tra poll loop e command loop su strutture condivise.
            - Edge case: JID mancante, DB non trovato, bridge HTTP giù.

            **3. Coerenza con il codebase**
            - Rispetta i pattern di `memory.py` (scope_dir_for, ensure_scope_skeleton).
            - Funzioni private prefissate con `_`, classi PascalCase, costanti UPPER_SNAKE.
            - Type hints dove mancano su firme pubbliche.

            **4. Manutenibilità**
            - Duplicazione logica tra nova_whatsapp.py e nova_whatsapp_server.py.
            - Funzioni troppo lunghe (>50 righe senza buona ragione).

            ## Formato output

            **🔴 Bloccante** (da fixare prima del merge) — elenco puntato.
            **🟡 Da valutare** (suggerimenti, non bloccanti).
            **🟢 Ok** (max 2-3 punti positivi).

            Se non c'è niente di bloccante, dillo e chiudi corto.
            Rispondi in **italiano**.
